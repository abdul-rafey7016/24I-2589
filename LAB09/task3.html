<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 3 - Flight Route Network</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .links line { stroke: #999; stroke-opacity: 0.6; }
    .nodes circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
    text { font-family: sans-serif; font-size: 10px; pointer-events: none; }
  </style>
</head>
<body>
  <h2>Pakistan Flight Route Network</h2>
  <div id="network"></div>

  <script>
    const width = 800, height = 500;

    const svg = d3.select("#network").append("svg")
        .attr("width", width)
        .attr("height", height);

    d3.csv("dataset/flights.csv", d3.autoType).then(data => {
      // 1. Build node set and calculate node degrees
      const nodesMap = new Map();
      data.forEach(d => {
        nodesMap.set(d.source, (nodesMap.get(d.source) || 0) + 1);
        nodesMap.set(d.target, (nodesMap.get(d.target) || 0) + 1);
      });

      const nodes = Array.from(nodesMap.keys(), id => ({ id, degree: nodesMap.get(id) }));
      const links = data.map(d => ({ source: d.source, target: d.target, value: d.flights }));

      // 2. Scales
      const radiusScale = d3.scaleSqrt()
        .domain(d3.extent(nodes, d => d.degree))
        .range([6, 18]);

      const strokeScale = d3.scaleLinear()
        .domain(d3.extent(links, d => d.value))
        .range([1, 6]);

      // 3. Force Simulation
      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2));

      // 4. Render Links
      const link = svg.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke-width", d => strokeScale(d.value));

      // 5. Render Nodes
      const node = svg.append("g")
        .attr("class", "nodes")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      node.append("circle")
        .attr("r", d => radiusScale(d.degree))
        .attr("fill", "#69b3a2");

      node.append("text")
        .attr("x", 12)
        .attr("y", ".31em")
        .text(d => d.id);

      // 6. Interactive Hovering
      node.on("mouseover", (event, d) => {
        link.style("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.1)
            .style("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "#ff4d4d" : "#999");
        node.style("opacity", n => (n.id === d.id || links.some(l => (l.source.id === d.id && l.target.id === n.id) || (l.target.id === d.id && l.source.id === n.id))) ? 1 : 0.2);
      }).on("mouseout", () => {
        link.style("stroke-opacity", 0.6).style("stroke", "#999");
        node.style("opacity", 1);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(event, d) {
        d.fx = event.x; d.fy = event.y;
      }
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      }
    });
  </script>
</body>
</html>
